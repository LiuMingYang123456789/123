[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-guided-pv"
version = "0.1.0"
description = "Reverso and self-calibrated solar-guided spatial-frequency network for PV forecasting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
